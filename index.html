// ---- HELPERS -----------------------------------------------
const fmt = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const toMonthly = s => s.cycle==='year' ? s.price/12 : s.price;
const toYearly = s => s.cycle==='year' ? s.price : s.price*12;
const daysUntil = (d) => {
  const today = new Date('2026-04-22');
  const t = new Date(d);
  return Math.round((t-today)/86400000);
};

// ---- STORAGE -----------------------------------------------
const STORAGE_KEY = 'substack-v1';
const TODAY_STR = '2026-04-22';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveStore(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.warn('save failed', e); }
}

// ---- STATS -----------------------------------------------
function useStats(subs) {
  return useMemo(() => {
    const active = subs.filter(s => s.status==='active' || s.status==='trial');
    const monthly = active.reduce((a,s)=>a+toMonthly(s),0);
    const yearly = active.reduce((a,s)=>a+toYearly(s),0);
    const byCat = {};
    active.forEach(s => {
      byCat[s.cat] = (byCat[s.cat]||0) + toMonthly(s);
    });
    const upcoming = subs
      .filter(s => s.status!=='paused')
      .map(s => ({...s, days: daysUntil(s.next)}))
      .filter(s => s.days>=0 && s.days<=30)
      .sort((a,b)=>a.days-b.days);
    const lowUsage = active.filter(s => s.usage<0.4).sort((a,b)=>a.usage-b.usage);
    return { monthly, yearly, byCat, upcoming, lowUsage, count: active.length };
  }, [subs]);
}

// ---- APP -----------------------------------------------
function App() {
  const initial = useMemo(() => loadStore(), []);
  const [dark, setDark] = useState(initial?.dark ?? false);
  const [view, setView] = useState('today');
  const [subs, setSubs] = useState(initial?.subs ?? SUBS);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('all');
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('next');
  const [usedToday, setUsedToday] = useState(() => {
    const stored = initial?.usedToday;
    if (stored?.date === TODAY_STR && Array.isArray(stored.ids)) return new Set(stored.ids);
    return new Set([4, 7, 13, 16]);
  });
  const [showAdd, setShowAdd] = useState(false);
  const [savedAt, setSavedAt] = useState(initial ? 'loaded' : 'new');
  const fileInputRef = useRef(null);

  // auto save on any change
  useEffect(() => {
    saveStore({
      version: 1,
      subs,
      dark,
      usedToday: { date: TODAY_STR, ids: [...usedToday] },
      savedAt: new Date().toISOString()
    });
    setSavedAt(new Date().toISOString());
  }, [subs, dark, usedToday]);

  const exportData = () => {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      subs, dark,
      usedToday: { date: TODAY_STR, ids: [...usedToday] }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `substack-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.subs)) throw new Error('invalid');
        if (!confirm(`导入 ${data.subs.length} 条订阅？当前数据会被覆盖。`)) return;
        setSubs(data.subs);
        if (typeof data.dark === 'boolean') setDark(data.dark);
        if (data.usedToday?.date === TODAY_STR && Array.isArray(data.usedToday.ids)) {
          setUsedToday(new Set(data.usedToday.ids));
        }
      } catch {
        alert('文件格式错误，请选择 substack 导出的 JSON');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const resetData = () => {
    if (!confirm('恢复演示数据？当前所有订阅会被清空。')) return;
    setSubs(SUBS);
    setUsedToday(new Set([4, 7, 13, 16]));
  };

  const clearAll = () => {
    if (!confirm('清空所有订阅？此操作不可撤销。')) return;
    setSubs([]);
    setUsedToday(new Set());
  };

  const addSub = (tpl, plan, method) => {
    const today = new Date('2026-04-22');
    const next = new Date(today);
    if (plan.cycle==='year') next.setFullYear(next.getFullYear()+1);
    else next.setMonth(next.getMonth()+1);
    const nextStr = next.toISOString().slice(0,10);
    const newSub = {
      id: Math.max(...subs.map(s=>s.id))+1,
      name: tpl.name,
      vendor: tpl.vendor,
      cat: tpl.cat,
      plan: plan.name,
      price: plan.price,
      cycle: plan.cycle,
      started: '2026-04-22',
      next: nextStr,
      method: method,
      status: 'active',
      trial: false,
      shared: false,
      usage: 0.5,
      note: '刚添加'
    };
    setSubs([...subs, newSub]);
    setShowAdd(false);
  };

  const toggleUsed = (id) => {
    setUsedToday(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  };

  useEffect(() => {
    document.body.classList.toggle('dark', dark);
  }, [dark]);

  const stats = useStats(subs);

  return (
    <div style={{display:'grid', gridTemplateColumns:'220px 1fr', minHeight:'100vh'}}>
      <Sidebar view={view} setView={setView} dark={dark} setDark={setDark} stats={stats}
        onAdd={()=>setShowAdd(true)}
        onExport={exportData}
        onImportClick={()=>fileInputRef.current?.click()}
        onReset={resetData}
        onClearAll={clearAll}
        savedAt={savedAt}/>
      <input ref={fileInputRef} type="file" accept=".json,application/json" onChange={importData} style={{display:'none'}}/>
      <main style={{background:'var(--bg)', overflow:'hidden'}}>
        {view==='today' && <TodayView subs={subs} stats={stats} onPick={setSelected} usedToday={usedToday} toggleUsed={toggleUsed}/>}
        {view==='overview' && <Overview subs={subs} stats={stats} onPick={setSelected}/>}
        {view==='list' && <ListView subs={subs} setSubs={setSubs} onPick={setSelected} filter={filter} setFilter={setFilter} query={query} setQuery={setQuery} sort={sort} setSort={setSort} onAdd={()=>setShowAdd(true)}/>}
        {view==='calendar' && <CalendarView subs={subs} onPick={setSelected}/>}
        {view==='insights' && <InsightsView subs={subs} stats={stats}/>}
      </main>
      {selected && <DetailDrawer
        sub={selected}
        onClose={()=>setSelected(null)}
        onUpdate={(u)=>{setSubs(subs.map(s=>s.id===u.id?u:s)); setSelected(u);}}
        onDelete={(id)=>{setSubs(subs.filter(s=>s.id!==id)); setUsedToday(prev=>{const n=new Set(prev); n.delete(id); return n;}); setSelected(null);}}
      />}
      {showAdd && <AddModal onClose={()=>setShowAdd(false)} onAdd={addSub} existingNames={subs.map(s=>s.name)}/>}
    </div>
  );
}

                    border: `1.5px solid ${used ? 'var(--accent)' : 'var(--line)'}`,
                    background: used ? 'var(--accent)' : 'transparent',
                    display:'grid', placeItems:'center',
                    transition:'all .15s'
                  }}>
                    {used && <span style={{color:'#fff', fontSize:13, lineHeight:1}}>✓</span>}
                  </button>
                  <button onClick={()=>onPick(s)} style={{padding:0}}><Badge name={s.name} cat={s.cat}/></button>
                  <button onClick={()=>onPick(s)} style={{textAlign:'left', padding:0}}>
                    <div style={{fontSize:13, fontWeight:500, textDecoration: used?'line-through':'none', opacity: used?0.6:1}}>{s.name}</div>
                    <div style={{fontSize:11, color:'var(--ink-faint)'}}>
                      {s.plan} · <span style={{color: s.usage>0.7?'var(--positive)':s.usage>0.4?'var(--warning)':'var(--danger)'}}>
                        {Math.round(s.usage*100)}% 使用率
                      </span>
                    </div>
                  </button>
                  <div style={{textAlign:'right'}}>
                    <div className="mono" style={{fontSize:13, fontWeight:500, color: used?'var(--positive)':isWaste?'var(--danger)':'var(--ink)'}}>

                    </div>
                    <div style={{fontSize:10, color:'var(--ink-faint)'}}>每天</div>
                  </div>
                  <div style={{width:60, textAlign:'right', fontSize:10, color:'var(--ink-faint)'}}>
                    {used ? <span style={{color:'var(--positive)', fontWeight:500}}>已用 ✓</span>
                          : isWaste ? <span style={{color:'var(--danger)', fontWeight:500}}>在烧钱</span>
                          : <span>待使用</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Right column: billing today + week */}
        <div style={{display:'flex', flexDirection:'column', gap:24}}>
          {/* Billing today */}
          <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, padding:24}}>
            <div className="serif" style={{fontSize:22, marginBottom:4}}>今日扣款</div>
            <div style={{fontSize:12, color:'var(--ink-faint)', marginBottom:16}}>2026-04-22 自动续订</div>
            {billingToday.length===0 ? (
              <div style={{padding:'16px 0', fontSize:13, color:'var(--ink-soft)'}}>
                ✨ 今天没有订阅扣款
                <div style={{fontSize:11, color:'var(--ink-faint)', marginTop:4}}>下次扣款 {stats.upcoming[0]?.days} 天后 · {stats.upcoming[0]?.name}</div>
              </div>
            ) : (
              billingToday.map(s => (
                <div key={s.id} style={{display:'flex', gap:12, alignItems:'center', padding:'10px 0'}}>
                  <Badge name={s.name} cat={s.cat}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13, fontWeight:500}}>{s.name}</div>
                    <div style={{fontSize:11, color:'var(--ink-faint)'}}>{s.method}</div>
                  </div>
                  <div className="mono" style={{fontSize:14, fontWeight:500}}>{fmt(s.price)}</div>
                </div>
              ))
            )}
          </div>

          {/* Waste tally */}
          <div style={{
            background:'var(--bg)', border:'1px solid var(--line)', borderRadius:12, padding:24,
            borderLeft:'3px solid var(--danger)'
          }}>
            <div style={{fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--ink-faint)', marginBottom:8}}>如果今天不用</div>
            <div className="serif" style={{fontSize:40, lineHeight:1, marginBottom:6, color:'var(--danger)'}}>{fmt(wastedToday)}</div>
            <div style={{fontSize:12, color:'var(--ink-soft)', lineHeight:1.6}}>
              {active.length - usedCount} 个订阅今天还没用到。
              一个月按此速度浪费 <span className="mono" style={{color:'var(--danger)', fontWeight:500}}>{fmt(wastedToday*30)}</span>。
            </div>
          </div>

          {/* 7-day streak */}
          <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, padding:24}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:16}}>
              <div className="serif" style={{fontSize:20}}>最近 7 天</div>
              <div style={{fontSize:11, color:'var(--ink-faint)'}} className="mono">使用率</div>
            </div>
            <div style={{display:'flex', gap:6, alignItems:'flex-end', height:80}}>
              {weekData.map((d,i) => {
                const pct = d.used / d.total;
                const isToday = i===weekData.length-1;
                return (
                  <div key={i} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:6}}>
                    <div style={{
                      width:'100%',
                      height: `${pct*60+8}px`,
                      background: isToday ? 'var(--accent)' : pct>0.5 ? 'var(--positive)' : pct>0.3 ? 'var(--warning)' : 'var(--danger)',
                      borderRadius:3,
                      opacity: isToday?1:0.6
                    }}/>
                    <div style={{fontSize:10, color: isToday?'var(--ink)':'var(--ink-faint)', fontWeight: isToday?600:400}}>{d.d}</div>
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:12, fontSize:11, color:'var(--ink-soft)'}}>
              最佳日 周一 11/18 · 今日 {usedCount}/{active.length}
            </div>
          </div>
        </div>
      </div>

      {/* Bottom: daily breakdown */}
      <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, padding:24}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:18}}>
          <div className="serif" style={{fontSize:22}}>今日成本分解</div>
          <div className="mono" style={{fontSize:12, color:'var(--ink-soft)'}}>按日摊销</div>
        </div>
        <div style={{display:'flex', height:24, borderRadius:6, overflow:'hidden', marginBottom:14}}>
          {actionables.map(s => (
            <div key={s.id}
              onClick={()=>onPick(s)}
              style={{
                width:`${s.daily/dailyTotal*100}%`,
                background: CAT_COLOR[s.cat],
                opacity: usedToday.has(s.id)?1:0.35,
                cursor:'pointer',
                transition:'opacity .2s'
              }}
              title={`${s.name}: ${fmt(s.daily)}/day`}/>
          ))}
        </div>
        <div style={{fontSize:11, color:'var(--ink-faint)', display:'flex', justifyContent:'space-between'}}>
          <span>彩色 = 已使用 · 灰色 = 未使用</span>
          <span className="mono">合计 {fmt(dailyTotal)}/天</span>
        </div>
      </div>
    </div>
  );
}

// ---- LIST VIEW -----------------------------------------------
function ListView({ subs, setSubs, onPick, filter, setFilter, query, setQuery, sort, setSort, onAdd }) {
  const cats = ['all', ...new Set(subs.map(s=>s.cat))];
  const filtered = useMemo(() => {
    let r = subs;
    if (filter!=='all') r = r.filter(s => s.cat===filter);
    if (query) r = r.filter(s => s.name.toLowerCase().includes(query.toLowerCase()) || s.vendor.toLowerCase().includes(query.toLowerCase()));
    r = [...r].sort((a,b) => {
      if (sort==='next') return daysUntil(a.next) - daysUntil(b.next);
      if (sort==='price') return toMonthly(b) - toMonthly(a);
      if (sort==='name') return a.name.localeCompare(b.name);
      if (sort==='started') return new Date(b.started) - new Date(a.started);
      return 0;
    });
    return r;
  }, [subs, filter, query, sort]);

  return (
    <div style={{padding:'32px 40px', maxHeight:'100vh', overflow:'auto'}}>
      <Header title="Ledger" subtitle={`共 ${filtered.length} 条订阅记录`} date="全部记录"/>

      {/* Toolbar */}
      <div style={{display:'flex', gap:12, marginBottom:20, alignItems:'center', flexWrap:'wrap'}}>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索订阅名、服务商…" style={{
          flex:'1 1 240px', padding:'9px 14px', background:'var(--surface)', border:'1px solid var(--line)',
          borderRadius:8, fontSize:13, color:'var(--ink)', outline:'none'
        }}/>
        <div style={{display:'flex', gap:4, padding:3, background:'var(--surface)', border:'1px solid var(--line)', borderRadius:8}}>
          {cats.map(c => (
            <button key={c} onClick={()=>setFilter(c)} style={{
              padding:'5px 10px', borderRadius:5, fontSize:12,
              background: filter===c ? 'var(--bg)' : 'transparent',
              color: filter===c ? 'var(--ink)' : 'var(--ink-soft)',
              fontWeight: filter===c ? 500 : 400
            }}>{c==='all'?'全部':c}</button>
          ))}
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{
          padding:'8px 12px', background:'var(--surface)', border:'1px solid var(--line)',
          borderRadius:8, fontSize:12, color:'var(--ink)', outline:'none'
        }}>
          <option value="next">按下次扣款</option>
          <option value="price">按月费</option>
          <option value="name">按名称</option>
          <option value="started">按订阅日期</option>
        </select>
        <button onClick={onAdd} style={{
          padding:'9px 16px', background:'var(--ink)', color:'var(--surface)',
          borderRadius:8, fontSize:12, fontWeight:500
        }}>+ 新增订阅</button>
      </div>

      {/* Table */}
      <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, overflow:'hidden'}}>
        <div style={{
          display:'grid', gridTemplateColumns:'40px 1.8fr 1fr 1fr 1fr 1fr 80px',
          gap:16, padding:'12px 20px',
          fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--ink-faint)',
          borderBottom:'1px solid var(--line)', background:'var(--bg)'
        }}>
          <div></div>
          <div>名称 / 方案</div>
          <div>分类</div>
          <div>价格</div>
          <div>下次扣款</div>
          <div>支付方式</div>
          <div>状态</div>
        </div>
        {filtered.map((s,i) => (
          <button key={s.id} onClick={()=>onPick(s)} style={{
            display:'grid', gridTemplateColumns:'40px 1.8fr 1fr 1fr 1fr 1fr 80px',
            gap:16, padding:'14px 20px', alignItems:'center',
            borderBottom: i<filtered.length-1 ? '1px solid var(--line-soft)' : 'none',
            background: 'transparent', textAlign:'left', width:'100%',
            transition:'background .15s'
          }} onMouseEnter={e=>e.currentTarget.style.background='var(--bg)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Badge name={s.name} cat={s.cat}/>
            <div>
              <div style={{fontSize:13, fontWeight:500, marginBottom:2}}>{s.name}
                {s.shared && <span style={{marginLeft:6, fontSize:9, padding:'1px 5px', background:'var(--accent-soft)', color:'var(--accent)', borderRadius:3, fontWeight:500}}>SHARED</span>}
              </div>
              <div style={{fontSize:11, color:'var(--ink-faint)'}}>{s.plan}</div>
            </div>
            <div><CatPill cat={s.cat}/></div>
            <div>
              <div className="mono" style={{fontSize:13, fontWeight:500}}>{fmt(s.price)}</div>
              <div style={{fontSize:10, color:'var(--ink-faint)'}}>每{s.cycle==='year'?'年':'月'}</div>
            </div>
            <div>
              <div className="mono" style={{fontSize:12}}>{s.next}</div>
              <div style={{fontSize:10, color: daysUntil(s.next)<=7?'var(--accent)':'var(--ink-faint)'}}>
                {daysUntil(s.next)<=0 ? '今天' : `${daysUntil(s.next)} 天后`}
              </div>
            </div>
            <div style={{fontSize:12, color:'var(--ink-soft)'}} className="mono">{s.method}</div>
            <div><StatusDot status={s.status}/></div>
          </button>
        ))}
        {filtered.length===0 && <div style={{padding:40, textAlign:'center', color:'var(--ink-faint)', fontSize:13}}>没有匹配的订阅</div>}
      </div>
    </div>
  );
}

// ---- CALENDAR VIEW -----------------------------------------------
function CalendarView({ subs, onPick }) {
  const startMonth = new Date('2026-04-01');
  const days = [];
  const firstDay = startMonth.getDay();
  for (let i=0; i<firstDay; i++) days.push(null);
  for (let i=1; i<=30; i++) days.push(i);

  const subsOnDay = (day) => {
    if (!day) return [];
    const ymd = `2026-04-${String(day).padStart(2,'0')}`;
    return subs.filter(s => s.next===ymd && s.status!=='paused');
  };

  const monthTotal = subs.filter(s => s.next.startsWith('2026-04') && s.status!=='paused').reduce((a,s)=>a+s.price,0);

  return (
    <div style={{padding:'32px 40px', maxHeight:'100vh', overflow:'auto'}}>
      <Header title="Calendar" subtitle="按日期查看续订与扣款" date="2026 年 4 月"/>

      <div style={{display:'flex', justifyContent:'space-between', marginBottom:20, alignItems:'center'}}>
        <div style={{display:'flex', gap:4, background:'var(--surface)', border:'1px solid var(--line)', borderRadius:8, padding:3}}>
          <button style={{padding:'6px 12px', borderRadius:5, fontSize:12, color:'var(--ink-soft)'}}>‹</button>
          <div style={{padding:'6px 16px', fontSize:13, fontWeight:500}}>2026 · 四月</div>
          <button style={{padding:'6px 12px', borderRadius:5, fontSize:12, color:'var(--ink-soft)'}}>›</button>
        </div>
        <div className="mono" style={{fontSize:13, color:'var(--ink-soft)'}}>本月合计 <span style={{color:'var(--ink)', fontWeight:500}}>{fmt(monthTotal)}</span></div>
      </div>

      <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, overflow:'hidden'}}>
        <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', borderBottom:'1px solid var(--line)'}}>
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => (
            <div key={d} style={{padding:'10px 12px', fontSize:10, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--ink-faint)', textAlign:'center', borderRight:'1px solid var(--line-soft)'}}>{d}</div>
          ))}
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)'}}>
          {days.map((day, i) => {
            const dayS = subsOnDay(day);
            const isToday = day===22;
            return (
              <div key={i} style={{
                minHeight:110, padding:8,
                borderRight: (i+1)%7!==0 ? '1px solid var(--line-soft)' : 'none',
                borderBottom: i<days.length-7 ? '1px solid var(--line-soft)' : 'none',
                background: isToday ? 'var(--accent-soft)' : 'transparent',
                position:'relative'
              }}>
                {day && (
                  <>
                    <div style={{
                      fontSize:11, fontWeight: isToday?600:400,
                      color: isToday?'var(--accent)':'var(--ink-soft)',
                      marginBottom:4
                    }} className="mono">{String(day).padStart(2,'0')}</div>
                    <div style={{display:'flex', flexDirection:'column', gap:3}}>
                      {dayS.slice(0,3).map(s => (
                        <button key={s.id} onClick={()=>onPick(s)} style={{
                          display:'flex', gap:5, padding:'3px 6px',
                          background:'var(--bg)', borderRadius:4, border:`1px solid ${CAT_COLOR[s.cat]}33`,
                          borderLeft:`3px solid ${CAT_COLOR[s.cat]}`,
                          fontSize:10, alignItems:'center', textAlign:'left'
                        }}>
                          <div style={{fontWeight:500, maxWidth:70, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.name}</div>
                          <div className="mono" style={{marginLeft:'auto', color:'var(--ink-soft)', fontSize:9}}>{fmt(s.price).replace('.00','')}</div>
                        </button>
                      ))}
                      {dayS.length>3 && <div style={{fontSize:10, color:'var(--ink-faint)', paddingLeft:4}}>+{dayS.length-3} more</div>}
                    </div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ---- INSIGHTS VIEW -----------------------------------------------
function InsightsView({ subs, stats }) {
  const totalYearly = stats.yearly;
  const aiYearly = subs.filter(s=>s.cat==='AI' && s.status!=='paused').reduce((a,s)=>a+toYearly(s),0);
  const entYearly = subs.filter(s=>s.cat==='Entertainment' && s.status!=='paused').reduce((a,s)=>a+toYearly(s),0);
  const byMethod = {};
  subs.filter(s=>s.status!=='paused').forEach(s => { byMethod[s.method] = (byMethod[s.method]||0) + toMonthly(s); });

  return (
    <div style={{padding:'32px 40px', maxHeight:'100vh', overflow:'auto'}}>
      <Header title="Insights" subtitle="深度分析与优化建议" date="最近 12 个月"/>

      {/* Big number */}
      <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, padding:'32px 40px', marginBottom:24}}>
        <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-faint)', marginBottom:8}}>年度总开销</div>
        <div className="serif" style={{fontSize:72, lineHeight:1, marginBottom:8, color:'var(--ink)'}}>{fmt(totalYearly)}</div>

// ---- DETAIL DRAWER -----------------------------------------------
function DetailDrawer({ sub, onClose, onUpdate, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(sub);

  useEffect(() => { setDraft(sub); setEditing(false); }, [sub.id]);

  const patch = (k, v) => setDraft(d => ({...d, [k]: v}));
  const save = () => {
    const price = parseFloat(draft.price);
    if (isNaN(price) || price < 0) { alert('价格需要是正数'); return; }
    const usage = Math.max(0, Math.min(1, parseFloat(draft.usage) || 0));
    onUpdate({...draft, price, usage});
    setEditing(false);
  };
  const cancel = () => { setDraft(sub); setEditing(false); };
  const remove = () => {
    if (confirm(`确定取消订阅 ${sub.name}？此操作不可撤销。`)) onDelete(sub.id);
  };

  const catOptions = Object.keys(CAT_COLOR);
  const methodOptions = ['Visa ••4821', 'Mastercard ••9911', 'Apple Pay', 'PayPal', 'Amex ••1002'];
  const statusOptions = [['active','Active'],['paused','Paused'],['trial','Trial']];
  const cycleOptions = [['month','按月'],['year','按年']];

  const view = editing ? draft : sub;

  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(26,24,20,.4)',
      display:'flex', justifyContent:'flex-end', zIndex:100, backdropFilter:'blur(4px)'
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        width:460, maxWidth:'100vw', height:'100vh', background:'var(--surface)',
        padding:'28px 32px', overflow:'auto', boxShadow:'-20px 0 40px -10px rgba(0,0,0,.2)'
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:24}}>
          <div style={{display:'flex', gap:14, alignItems:'center'}}>
            <Badge name={view.name} cat={view.cat} size={48}/>
            <div>
              <div className="serif" style={{fontSize:28, lineHeight:1, marginBottom:2}}>{view.name}</div>
              <div style={{fontSize:12, color:'var(--ink-soft)'}}>{view.vendor} · {view.plan}</div>
            </div>
          </div>
          <button onClick={onClose} style={{fontSize:20, color:'var(--ink-faint)', padding:4}}>×</button>
        </div>

        {editing ? (
          <>
            <div style={{fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--ink-faint)', marginBottom:12}}>编辑中</div>

            <EditField label="方案名">
              <TextInput value={draft.plan} onChange={v=>patch('plan', v)}/>
            </EditField>

            <EditField label="价格">
              <div style={{display:'flex', gap:8}}>
                <TextInput value={draft.price} onChange={v=>patch('price', v)} type="number" style={{flex:1}}/>
                <SelectInput value={draft.cycle} onChange={v=>patch('cycle', v)} options={cycleOptions}/>
              </div>
            </EditField>

            <EditField label="下次扣款">
              <TextInput value={draft.next} onChange={v=>patch('next', v)} type="date"/>
            </EditField>

            <EditField label="开始日期">
              <TextInput value={draft.started} onChange={v=>patch('started', v)} type="date"/>
            </EditField>

            <EditField label="支付方式">
              <SelectInput value={draft.method} onChange={v=>patch('method', v)} options={methodOptions.map(m=>[m,m])}/>
            </EditField>

            <EditField label="分类">
              <SelectInput value={draft.cat} onChange={v=>patch('cat', v)} options={catOptions.map(c=>[c,c])}/>
            </EditField>

            <EditField label="状态">
              <SelectInput value={draft.status} onChange={v=>patch('status', v)} options={statusOptions}/>
            </EditField>

            <EditField label="使用率">
              <div style={{display:'flex', gap:10, alignItems:'center'}}>
                <input type="range" min="0" max="1" step="0.01" value={draft.usage}
                  onChange={e=>patch('usage', parseFloat(e.target.value))}
                  style={{flex:1, accentColor:'var(--accent)'}}/>
                <div className="mono" style={{fontSize:13, minWidth:44, textAlign:'right'}}>{Math.round(draft.usage*100)}%</div>
              </div>
            </EditField>

            <EditField label="共享">
              <div style={{display:'flex', gap:6}}>
                <PillToggle active={draft.shared} onClick={()=>patch('shared', true)} label="是"/>
                <PillToggle active={!draft.shared} onClick={()=>patch('shared', false)} label="否"/>
              </div>
            </EditField>

            <EditField label="备注">
              <textarea value={draft.note || ''} onChange={e=>patch('note', e.target.value)}
                rows={2} style={inputStyle()}/>
            </EditField>

            <div style={{display:'flex', gap:8, marginTop:24}}>
              <button onClick={save} style={{flex:1, padding:'11px', background:'var(--ink)', color:'var(--surface)', borderRadius:8, fontSize:13, fontWeight:500}}>保存修改</button>
              <button onClick={cancel} style={{flex:1, padding:'11px', background:'transparent', border:'1px solid var(--line)', borderRadius:8, fontSize:13, fontWeight:500, color:'var(--ink-soft)'}}>取消</button>
            </div>
          </>
        ) : (
          <>
            <div style={{background:'var(--bg)', borderRadius:10, padding:20, marginBottom:20}}>
              <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8}}>当前费用</div>
              <div style={{display:'flex', alignItems:'baseline', gap:8}}>
                <div className="serif" style={{fontSize:44, lineHeight:1}}>{fmt(sub.price)}</div>
                <div style={{fontSize:14, color:'var(--ink-soft)'}}>/ {sub.cycle==='year'?'年':'月'}</div>
              </div>
              {sub.cycle==='year' && <div className="mono" style={{fontSize:11, color:'var(--ink-faint)', marginTop:4}}>≈ {fmt(sub.price/12)} / 月</div>}
            </div>

            <Field label="下次扣款" value={`${sub.next} · ${daysUntil(sub.next)} 天后`}/>
            <Field label="支付方式" value={sub.method}/>
            <Field label="开始日期" value={sub.started}/>
            <Field label="已订阅" value={`${Math.floor((new Date('2026-04-22')-new Date(sub.started))/(365*86400000))} 年 ${Math.floor(((new Date('2026-04-22')-new Date(sub.started))/86400000 % 365)/30)} 个月`}/>
            <Field label="累计支出" value={fmt(toMonthly(sub) * Math.floor((new Date('2026-04-22')-new Date(sub.started))/(30*86400000)))}/>
            <Field label="分类" value={<CatPill cat={sub.cat}/>}/>
            <Field label="共享" value={sub.shared ? '是' : '否'}/>
            <Field label="状态" value={<StatusDot status={sub.status}/>}/>

            <div style={{marginTop:20, paddingTop:20, borderTop:'1px solid var(--line)'}}>
              <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:10}}>使用率</div>
              <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:6}}>
                <div style={{flex:1, height:8, background:'var(--line)', borderRadius:4, overflow:'hidden'}}>
                  <div style={{width:`${sub.usage*100}%`, height:'100%', background: sub.usage>0.7?'var(--positive)':sub.usage>0.4?'var(--warning)':'var(--danger)'}}/>
                </div>
                <div className="mono" style={{fontSize:14, fontWeight:500, minWidth:50, textAlign:'right'}}>{Math.round(sub.usage*100)}%</div>
              </div>
              <div style={{fontSize:11, color:'var(--ink-soft)'}}>
                {sub.usage>0.7 ? '使用充分，值得保留' : sub.usage>0.4 ? '中等使用率' : '使用率偏低，建议考虑取消'}
              </div>
            </div>

            {sub.note && (
              <div style={{marginTop:20, padding:14, background:'var(--bg)', borderRadius:8, borderLeft:'3px solid var(--ink-faint)'}}>
                <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6}}>备注</div>
                <div style={{fontSize:13, color:'var(--ink-soft)'}}>{sub.note}</div>
              </div>
            )}

            <div style={{display:'flex', gap:8, marginTop:24}}>
              <button onClick={()=>setEditing(true)} style={{flex:1, padding:'10px', background:'var(--ink)', color:'var(--surface)', borderRadius:8, fontSize:12, fontWeight:500}}>编辑订阅</button>
              <button onClick={remove} style={{flex:1, padding:'10px', background:'transparent', color:'var(--danger)', border:'1px solid var(--danger)', borderRadius:8, fontSize:12, fontWeight:500}}>取消订阅</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const inputStyle = () => ({
  width:'100%', padding:'9px 12px',
  background:'var(--bg)', border:'1px solid var(--line)',
  borderRadius:7, fontSize:13, color:'var(--ink)', outline:'none',
  fontFamily:'inherit', boxSizing:'border-box', resize:'vertical'
});

function EditField({ label, children }) {
  return (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:6}}>{label}</div>
      {children}
    </div>
  );
}

function TextInput({ value, onChange, type='text', style={} }) {
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} style={{...inputStyle(), ...style}}/>;
}

function SelectInput({ value, onChange, options }) {
  return (
    <select value={value} onChange={e=>onChange(e.target.value)} style={inputStyle()}>
      {options.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
    </select>
  );
}

function PillToggle({ active, onClick, label }) {
  return (
    <button onClick={onClick} style={{
      flex:1, padding:'8px 14px', borderRadius:7, fontSize:12, fontWeight:500,
      background: active ? 'var(--accent-soft)' : 'var(--bg)',
      border: `1px solid ${active ? 'var(--accent)' : 'var(--line)'}`,
      color: active ? 'var(--accent)' : 'var(--ink-soft)'
    }}>{label}</button>
  );
}

function AddModal({ onClose, onAdd, existingNames }) {
  const [query, setQuery] = useState('');

  const [selectedTpl, setSelectedTpl] = useState(null);
  const [selectedPlan, setSelectedPlan] = useState(null);
  const [method, setMethod] = useState('Visa ••4821');

  const cats = ['all', ...Array.from(new Set(TEMPLATES.map(t=>t.cat)))];

  const filtered = useMemo(() => {
    let r = TEMPLATES;
    if (cat!=='all') r = r.filter(t => t.cat===cat);
    if (query) r = r.filter(t =>
      t.name.toLowerCase().includes(query.toLowerCase()) ||
      t.vendor.toLowerCase().includes(query.toLowerCase()) ||
      t.cat.toLowerCase().includes(query.toLowerCase())
    );
    return r;
  }, [query, cat]);

  const popular = TEMPLATES.filter(t => ['Netflix','Spotify','ChatGPT','Claude','Notion','Apple Music','iCloud+','1Password','YouTube Premium','GitHub','Figma','Cursor'].includes(t.name));

  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'rgba(26,24,20,.5)',

      padding:40
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        width:'min(960px, 100%)', maxHeight:'calc(100vh - 80px)',
        background:'var(--surface)', borderRadius:16, overflow:'hidden',

        {selectedTpl ? (
          <ConfigStep tpl={selectedTpl} selectedPlan={selectedPlan} setSelectedPlan={setSelectedPlan}

            onBack={()=>{setSelectedTpl(null); setSelectedPlan(null);}}
            onClose={onClose}
            onConfirm={()=>{ if (selectedPlan) onAdd(selectedTpl, selectedPlan, method); }}/>
        ) : (
          <BrowseStep
            query={query} setQuery={setQuery}
            cat={cat} setCat={setCat} cats={cats}
            filtered={filtered} popular={popular}
            existingNames={existingNames}
            onPick={t=>{setSelectedTpl(t); setSelectedPlan(t.plans[Math.min(1, t.plans.length-1)]);}}
            onClose={onClose}/>
        )}

function TemplateCard({ tpl, existingNames, onPick }) {
  const already = existingNames.includes(tpl.name);
  const lowPrice = Math.min(...tpl.plans.map(p => p.cycle==='year' ? p.price/12 : p.price));
  const highPrice = Math.max(...tpl.plans.map(p => p.cycle==='year' ? p.price/12 : p.price));

  return (
    <button onClick={()=>!already && onPick(tpl)} disabled={already} style={{
      padding:'14px', borderRadius:10,
      background:'var(--bg)', border:'1px solid var(--line)',
      textAlign:'left', display:'flex', gap:12, alignItems:'center',
      opacity: already ? 0.5 : 1,
      cursor: already ? 'default' : 'pointer',
      transition:'all .15s',
      position:'relative'
    }}
      onMouseEnter={e=>{if(!already){e.currentTarget.style.borderColor='var(--ink-soft)'; e.currentTarget.style.transform='translateY(-1px)';}}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--line)'; e.currentTarget.style.transform='translateY(0)';}}>
      <LogoIcon slug={tpl.slug} color={tpl.color} fallback={tpl.icon} size={40}/>
      <div style={{flex:1, minWidth:0}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
          <div style={{fontSize:13, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{tpl.name}</div>
          {already && <span style={{fontSize:9, padding:'1px 5px', background:'var(--line)', color:'var(--ink-soft)', borderRadius:3}}>已有</span>}
        </div>
        <div style={{fontSize:11, color:'var(--ink-faint)', display:'flex', gap:6, alignItems:'center'}}>
          <CatPill cat={tpl.cat}/>
          <span className="mono">
            {lowPrice===highPrice ? fmt(lowPrice) : `${fmt(lowPrice)}–${fmt(highPrice)}`}/m
          </span>
        </div>
      </div>
    </button>
  );
}

function TemplatePill({ tpl, existingNames, onPick }) {
  const already = existingNames.includes(tpl.name);
  return (
    <button onClick={()=>!already && onPick(tpl)} disabled={already} style={{
      padding:'14px 8px', borderRadius:10,
      background:'var(--bg)', border:'1px solid var(--line)',
      display:'flex', flexDirection:'column', alignItems:'center', gap:8,
      opacity: already ? 0.5 : 1,
      cursor: already ? 'default' : 'pointer',
      transition:'all .15s'
    }}
      onMouseEnter={e=>{if(!already){e.currentTarget.style.borderColor='var(--ink-soft)'; e.currentTarget.style.transform='translateY(-2px)';}}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--line)'; e.currentTarget.style.transform='translateY(0)';}}>
      <LogoIcon slug={tpl.slug} color={tpl.color} fallback={tpl.icon} size={44}/>
      <div style={{fontSize:11, fontWeight:500, textAlign:'center', width:'100%', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{tpl.name}</div>
    </button>
  );
}

        </button>
        <button onClick={onClose} style={{fontSize:22, color:'var(--ink-faint)'}}>×</button>
      </div>

      {/* Body */}
      <div style={{flex:1, overflow:'auto', padding:'28px 40px'}}>
        {/* Hero */}
        <div style={{display:'flex', gap:18, alignItems:'center', marginBottom:28}}>
          <LogoIcon slug={tpl.slug} color={tpl.color} fallback={tpl.icon} size={64}/>
          <div>
            <div className="serif" style={{fontSize:34, lineHeight:1, marginBottom:4}}>{tpl.name}</div>
            <div style={{fontSize:12, color:'var(--ink-soft)', display:'flex', gap:10, alignItems:'center'}}>
              <span>{tpl.vendor}</span>
              <span style={{width:3, height:3, background:'var(--ink-faint)', borderRadius:2}}/>
              <CatPill cat={tpl.cat}/>
            </div>
          </div>
        </div>

        {/* Plans */}
        <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-faint)', marginBottom:10}}>选择方案</div>
        <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:28}}>
          {tpl.plans.map(p => {
            const picked = selectedPlan?.name===p.name;
            const monthly = p.cycle==='year' ? p.price/12 : p.price;
            return (
              <button key={p.name} onClick={()=>setSelectedPlan(p)} style={{
                display:'grid', gridTemplateColumns:'24px 1fr auto', gap:14, alignItems:'center',
                padding:'14px 16px', borderRadius:10,
                background: picked ? 'var(--accent-soft)' : 'var(--bg)',
                border: `1.5px solid ${picked ? 'var(--accent)' : 'var(--line)'}`,
                textAlign:'left', transition:'all .15s'
              }}>
                <div style={{
                  width:18, height:18, borderRadius:9,
                  border:`1.5px solid ${picked ? 'var(--accent)' : 'var(--line)'}`,
                  background: picked ? 'var(--accent)' : 'transparent',
                  display:'grid', placeItems:'center'
                }}>
                  {picked && <span style={{width:7, height:7, borderRadius:4, background:'#fff'}}/>}
                </div>
                <div>
                  <div style={{fontSize:14, fontWeight:500}}>{p.name}</div>
                  <div style={{fontSize:11, color:'var(--ink-faint)'}}>
                    {p.cycle==='year' ? `按年付 · ≈ ${fmt(monthly)}/月` : '按月付'}
                  </div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="mono" style={{fontSize:15, fontWeight:500}}>{fmt(p.price)}</div>
                  <div style={{fontSize:10, color:'var(--ink-faint)'}}>每{p.cycle==='year'?'年':'月'}</div>
                </div>
              </button>
            );
          })}
        </div>

        {/* Payment method */}
        <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-faint)', marginBottom:10}}>支付方式</div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:8, marginBottom:24}}>
          {methods.map(m => (
            <button key={m} onClick={()=>setMethod(m)} style={{
              padding:'10px 12px', borderRadius:8,
              background: method===m ? 'var(--accent-soft)' : 'var(--bg)',
              border:`1.5px solid ${method===m ? 'var(--accent)' : 'var(--line)'}`,
              fontSize:12, textAlign:'left', fontFamily:'JetBrains Mono,monospace'
            }}>{m}</button>
          ))}
        </div>
      </div>

      {/* Footer */}
      <div style={{padding:'16px 28px', borderTop:'1px solid var(--line)', background:'var(--bg)', display:'flex', justifyContent:'space-between', alignItems:'center', gap:16}}>
        <div style={{fontSize:12, color:'var(--ink-soft)'}}>
          {selectedPlan ? (
            <>
              首次扣款 <span className="mono" style={{color:'var(--ink)', fontWeight:500}}>2026-05-22</span> · <span className="mono" style={{color:'var(--accent)', fontWeight:500}}>{fmt(selectedPlan.price)}</span>
            </>
          ) : '请选择方案'}
        </div>
        <button onClick={onConfirm} disabled={!selectedPlan} style={{
          padding:'10px 22px', background: selectedPlan ? 'var(--ink)' : 'var(--line)',
          color: selectedPlan ? 'var(--surface)' : 'var(--ink-faint)',
          borderRadius:8, fontSize:13, fontWeight:500,
          cursor: selectedPlan ? 'pointer' : 'default'
        }}>添加到 Ledger →</button>
      </div>
    </>
  );
}

// ---- PRIMITIVES -----------------------------------------------
function Header({ title, subtitle, date }) {
  return (
    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:28}}>
      <div>
        <div className="serif" style={{fontSize:44, lineHeight:1, marginBottom:6}}>{title}</div>
        <div style={{fontSize:13, color:'var(--ink-soft)'}}>{subtitle}</div>
      </div>
      <div style={{fontSize:11, color:'var(--ink-faint)', textTransform:'uppercase', letterSpacing:'0.08em'}} className="mono">{date}</div>
    </div>
  );
}

function StatBlock({ label, value, hint, trend }) {
  return (
    <div style={{padding:'20px 24px', background:'var(--surface)'}}>
      <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:6}}>{label}</div>
      <div className="serif" style={{fontSize:32, lineHeight:1.1, marginBottom:4}}>{value}</div>
      <div style={{fontSize:11, color: trend==='up'?'var(--accent)':'var(--ink-soft)'}}>{hint}</div>
    </div>
  );
}

function Card({ title, suffix, children }) {
  return (
    <div style={{background:'var(--surface)', border:'1px solid var(--line)', borderRadius:12, padding:24}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:18}}>
        <div className="serif" style={{fontSize:20}}>{title}</div>
        {suffix && <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.04em'}} className="mono">{suffix}</div>}
      </div>
      {children}
    </div>
  );
}

function LogoIcon({ slug, color, fallback, size=32 }) {
  const [err, setErr] = useState(false);
  const r = Math.max(6, Math.round(size*0.25));
  const pad = Math.round(size*0.22);

  if (!slug || err) {
    const bg = color || '#6b6459';
    return (
      <div style={{
        width:size, height:size, borderRadius:r,
        background: `${bg}22`, color: bg,
        display:'grid', placeItems:'center',
        fontSize: size*0.44, fontWeight:600,
        border: `1px solid ${bg}44`,
        flexShrink:0
      }}>{fallback}</div>
    );
  }
  return (
    <div style={{
      width:size, height:size, borderRadius:r,
      background: color || '#1a1814',
      display:'grid', placeItems:'center',
      padding: pad, boxSizing:'border-box',
      flexShrink:0
    }}>
      <img src={`https://cdn.simpleicons.org/${slug}/white`}
        onError={()=>setErr(true)} loading="lazy" alt=""
        style={{width:'100%', height:'100%', objectFit:'contain', display:'block'}}/>
    </div>
  );
}

function Badge({ name, cat, size=32 }) {
  const brand = BRAND_LOOKUP[name];
  if (brand) {
    return <LogoIcon slug={brand.slug} color={brand.color} fallback={brand.icon || name[0]} size={size}/>;
  }
  const color = CAT_COLOR[cat] || '#6b6459';
  return (
    <div style={{
      width:size, height:size, borderRadius: size/4,
      background: `${color}22`, color: color,
      display:'grid', placeItems:'center',
      fontSize: size*0.44, fontWeight:600,
      border: `1px solid ${color}44`,
      flexShrink:0
    }}>{name[0]}</div>
  );
}

function CatPill({ cat }) {
  const color = CAT_COLOR[cat] || '#6b6459';
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:5,
      padding:'2px 8px', borderRadius:4,
      background: `${color}15`, color: color,
      fontSize:11, fontWeight:500
    }}>
      <span style={{width:5, height:5, borderRadius:3, background:color}}/>
      {cat}
    </span>
  );
}

function StatusDot({ status }) {
  const m = {
    active: {c:'var(--positive)', t:'Active'},
    paused: {c:'var(--ink-faint)', t:'Paused'},
    trial:  {c:'var(--warning)', t:'Trial'}
  };
  const s = m[status] || m.active;
  return (
    <span style={{display:'inline-flex', alignItems:'center', gap:6, fontSize:11, color:'var(--ink-soft)'}}>
      <span style={{width:6, height:6, borderRadius:3, background:s.c}}/>
      {s.t}
    </span>
  );
}

function Sparkline({ data, labels }) {
  const max = Math.max(...data), min = Math.min(...data);
  const W = 500, H = 180, P = 20;
  const x = i => P + (i/(data.length-1))*(W-2*P);
  const y = v => P + (1-(v-min)/(max-min))*(H-2*P);
  const path = data.map((v,i) => `${i===0?'M':'L'}${x(i)},${y(v)}`).join(' ');
  const area = `${path} L${x(data.length-1)},${H-P} L${x(0)},${H-P} Z`;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H+30}`} style={{width:'100%', height:'auto'}}>
        <defs>
          <linearGradient id="gradFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.3"/>
            <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={area} fill="url(#gradFill)"/>
        <path d={path} stroke="var(--accent)" strokeWidth="2" fill="none"/>
        {data.map((v,i) => (
          <circle key={i} cx={x(i)} cy={y(v)} r={i===data.length-1?4:0} fill="var(--accent)" stroke="var(--surface)" strokeWidth="2"/>
        ))}
        {labels.map((l,i) => (
          <text key={i} x={x(i)} y={H+15} fontSize="10" fill="var(--ink-faint)" textAnchor="middle" fontFamily="JetBrains Mono">{l}月</text>
        ))}
      </svg>
    </div>
  );
}

function Recommendation({ kind, title, reason, save }) {
  const colorMap = {
    cancel: 'var(--danger)',
    downgrade: 'var(--warning)',
    bundle: 'var(--accent)',
    positive: 'var(--positive)'
  };
  const tagMap = {
    cancel:'取消', downgrade:'降级', bundle:'合并', positive:'良好'
  };
  const color = colorMap[kind];
  return (
    <div style={{padding:14, background:'var(--bg)', borderRadius:8, borderLeft:`3px solid ${color}`}}>
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:6, alignItems:'center'}}>
        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <span style={{fontSize:10, padding:'2px 6px', background:`${color}22`, color, borderRadius:3, fontWeight:500}}>{tagMap[kind]}</span>
          <div style={{fontSize:13, fontWeight:500}}>{title}</div>
        </div>
        {save>0 && <div className="mono" style={{fontSize:12, color:'var(--positive)', fontWeight:500}}>省 {fmt(save)}/年</div>}
      </div>
      <div style={{fontSize:12, color:'var(--ink-soft)', lineHeight:1.5}}>{reason}</div>
    </div>
  );
}

function Field({ label, value }) {
  return (
    <div style={{display:'grid', gridTemplateColumns:'120px 1fr', padding:'10px 0', borderBottom:'1px solid var(--line-soft)', alignItems:'center', gap:16}}>
      <div style={{fontSize:11, color:'var(--ink-faint)', letterSpacing:'0.06em', textTransform:'uppercase'}}>{label}</div>
      <div style={{fontSize:13}} className={typeof value==='string' && (value.includes('-')||value.includes('••'))?'mono':''}>{value}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
